description "uWSGI runSF"
start on runlevel [2345]
stop on runlevel [06]

respawn

exec /home/deployer/.virtualenvs/run_sf/bin/uwsgi --chmod-socket --pidfile /home/deployer/apps/run_sf/shared/pids/run_sf.pid --ini /home/deployer/apps/run_sf/shared/config/uwsgi.ini

post-stop script
    rm /home/deployer/apps/run_sf/shared/pids/run_sf.pid
end script
