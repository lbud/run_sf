[uwsgi]
chdir = /home/deployer/apps/run_sf/project
virtualenv = /home/deployer/.virtualenvs/run_sf
module = app:app
socket = /home/deployer/apps/run_sf/shared/sockets/run_sf.sock
logto = /home/deployer/apps/run_sf/shared/log/uwsgi.log
master = true
vacuum = true
limit-as = 256
max-request = 1000
evil-reload-on-as = 128
evil-reload-on-rss = 96
workers = 2
die-on-term = true
uid = 1000
gid = 1000
